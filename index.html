<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Stuff — Knowledge Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(8px);
      padding: 18px 20px;
      border-radius: 12px;
      border: 1px solid #30363d;
      max-width: 340px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 0.82rem;
      color: #8b949e;
      margin-bottom: 12px;
      line-height: 1.45;
    }
    #search {
      width: 100%;
      padding: 8px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #f0f6fc;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }
    #status {
      font-size: 0.76rem;
      color: #58a6ff;
      margin-top: 10px;
    }
    #legend {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.75rem;
      color: #8b949e;
      border-top: 1px solid #21262d;
      padding-top: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(22, 27, 34, 0.96);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      color: #c9d1d9;
      font-size: 0.8rem;
      max-width: 280px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 20;
    }
    .tt-title {
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 3px;
      font-size: 0.88rem;
    }
    .tt-meta {
      color: #8b949e;
      font-size: 0.74rem;
    }
    svg {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    .link {
      fill: none;
      stroke-opacity: 0.45;
      transition: stroke-opacity 0.2s ease, stroke-width 0.2s ease;
    }
    .link.highlighted {
      stroke-opacity: 1;
      stroke-width: 3px !important;
    }
    .node {
      cursor: pointer;
    }
    .node circle {
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.2s ease;
    }
    .node:hover circle {
      transform: scale(1.35);
    }
    .node text {
      font-size: 12.5px;
      fill: #c9d1d9;
      pointer-events: none;
      text-shadow: 0 2px 4px #0d1117, 0 -2px 4px #0d1117, 2px 0 4px #0d1117, -2px 0 4px #0d1117;
      transition: fill 0.2s ease, font-weight 0.2s ease;
    }
    .node:hover text {
      fill: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h1>Semantic Knowledge Map</h1>
    <p class="subtitle">Fixed radial layout grouped by topic relativity. Hover over any node to highlight its cluster, or click to read.</p>
    <input type="text" id="search" placeholder="Search notes or topics...">
    <div id="status">Loading repository structure...</div>
    <div id="legend"></div>
  </div>

  <div id="tooltip"></div>
  <svg id="mindmap"></svg>

  <script>
    const DEFAULT_OWNER = 'skredx';
    const DEFAULT_REPO = 'tech-stuff';

    // Matches your updated repo structure including the LLMs/ folder
    const FALLBACK_FILES = [
      "KNN_(superv).html",
      "LLMs/LLMs from zero, Part 1_ Foundations and the Transformer.html",
      "LLMs/LLMs from zero, Part 2_ Transformer tricks and generation.html",
      "LLMs/LLMs from zero, Part 3_ Training, alignment and reasoning.html",
      "camera_calib_notes.html"
    ];

    // Distinct vibrant palette for different knowledge clusters
    const CLUSTER_PALETTE = [
      "#a371f7", // Purple (e.g. LLMs)
      "#3fb950", // Green (e.g. Supervised Learning)
      "#58a6ff", // Blue (e.g. Computer Vision / Calibration)
      "#f78166", // Coral
      "#d29922", // Gold
      "#ff7b72"  // Pink-Red
    ];

    const SHORTHAND_MAP = {
      'knn': { title: 'k-Nearest Neighbours (KNN)', category: 'Supervised Learning' },
      'superv': { title: 'Supervised Learning', category: 'Supervised Learning' },
      'camera_calib_notes': { title: 'Camera Calibration Notes', category: 'Computer Vision' },
      'calib': { title: 'Camera Calibration', category: 'Computer Vision' }
    };

    function getRepoDetails() {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (host.endsWith('github.io')) {
        const owner = host.split('.')[0];
        const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
        return { owner, repo };
      }
      return { owner: DEFAULT_OWNER, repo: DEFAULT_REPO };
    }

    async function fetchHtmlFileList() {
      const { owner, repo } = getRepoDetails();
      try {
        const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
        if (!repoRes.ok) throw new Error('API unavailable');
        const repoData = await repoRes.json();
        const branch = repoData.default_branch || 'main';

        const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
        if (!treeRes.ok) throw new Error('Tree unavailable');
        const treeData = await treeRes.json();

        const files = treeData.tree
          .filter(item => item.type === 'blob' && item.path.endsWith('.html') && item.path.toLowerCase() !== 'index.html')
          .map(item => item.path);

        return files.length ? files : FALLBACK_FILES;
      } catch {
        return FALLBACK_FILES;
      }
    }

    // Zero-network semantic parser: extracts clean titles and categories purely from path & filename context
    function parseFileSemantics(filePath) {
      const parts = filePath.split('/');
      const rawFileName = parts.pop().replace(/\.html$/i, '');
      const folderName = parts.length > 0 ? parts.join(' / ') : null;
      const encodedUrl = filePath.split('/').map(encodeURIComponent).join('/');

      let category = folderName;
      let displayTitle = rawFileName.replace(/_/g, ': ').replace(/\s+/g, ' ').trim();

      // 1. Check exact or token shorthand matches (e.g. KNN_(superv) or camera_calib_notes)
      const lowerRaw = rawFileName.toLowerCase();
      if (SHORTHAND_MAP[lowerRaw]) {
        displayTitle = SHORTHAND_MAP[lowerRaw].title;
        category = category || SHORTHAND_MAP[lowerRaw].category;
      } else {
        const parenMatch = rawFileName.match(/^([a-zA-Z0-9_-]+?)\s*\(([^)]+)\)$/);
        if (parenMatch) {
          const baseKey = parenMatch[1].replace(/_/g, '').toLowerCase();
          const tagKey = parenMatch[2].toLowerCase();
          displayTitle = SHORTHAND_MAP[baseKey]?.title || parenMatch[1];
          if (!category && SHORTHAND_MAP[tagKey]) {
            category = SHORTHAND_MAP[tagKey].category;
          }
        }
      }

      // 2. Strip series prefixes like "LLMs from zero, Part 1: Foundations..."
      const seriesRegex = /^(.+?)(?:,\s*|\s+-\s+|\s+)?(?:Part|Ch|Chapter|Module)\s*(\d+)\s*[:\-–_]\s*(.+)$/i;
      const seriesMatch = displayTitle.match(seriesRegex);
      if (seriesMatch) {
        const seriesName = seriesMatch[1].trim();
        const partNum = seriesMatch[2].trim();
        const coreTopic = seriesMatch[3].trim();
        category = category || seriesName;
        displayTitle = `Part ${partNum}: ${coreTopic}`;
      } else if (!category) {
        // Fallback category for standalone root files
        if (lowerRaw.includes('calib') || lowerRaw.includes('camera')) {
          category = 'Computer Vision';
          displayTitle = 'Camera Calibration';
        } else {
          category = 'General Notes';
        }
      }

      return {
        title: displayTitle,
        category: category,
        rawPath: filePath,
        url: encodedUrl
      };
    }

    function buildHierarchyData(parsedFiles) {
      const root = {
        name: "Tech Stuff",
        type: "root",
        children: []
      };

      const categoryMap = new Map();
      parsedFiles.forEach(file => {
        if (!categoryMap.has(file.category)) {
          const catNode = {
            name: file.category,
            type: "category",
            category: file.category,
            children: []
          };
          categoryMap.set(file.category, catNode);
          root.children.push(catNode);
        }
        categoryMap.get(file.category).children.push({
          name: file.title,
          type: "file",
          category: file.category,
          rawPath: file.rawPath,
          url: file.url
        });
      });

      return root;
    }

    function renderFixedMindMap(hierarchyData, totalFiles) {
      const svg = d3.select('#mindmap');
      const tooltip = d3.select('#tooltip');
      const width = window.innerWidth;
      const height = window.innerHeight;
      const radius = Math.min(width, height) * 0.36;

      svg.selectAll('*').remove();

      // Center container
      const g = svg.append('g')
        .attr('transform', `translate(${width / 2},${height / 2})`);

      // Allow smooth canvas pan/zoom while keeping node positions strictly fixed
      svg.call(
        d3.zoom()
          .scaleExtent([0.4, 3])
          .on('zoom', (e) => g.attr('transform', e.transform))
          .transform,
        d3.zoomIdentity.translate(width / 2, height / 2)
      );

      // Assign a unique color to each top-level category cluster
      const categories = (hierarchyData.children || []).map(d => d.name);
      const colorScale = d3.scaleOrdinal()
        .domain(categories)
        .range(CLUSTER_PALETTE);

      // Populate dynamic color legend
      const legendEl = document.getElementById('legend');
      legendEl.innerHTML = categories.map(cat => `
        <div class="legend-item">
          <span class="dot" style="background:${colorScale(cat)}; box-shadow: 0 0 6px ${colorScale(cat)};"></span>
          <span>${cat}</span>
        </div>
      `).join('');

      // Compute deterministic, zero-computation radial tree coordinates
      const root = d3.hierarchy(hierarchyData);
      const treeLayout = d3.tree()
        .size([2 * Math.PI, radius])
        .separation((a, b) => (a.parent === b.parent ? 1.3 : 2.2) / (a.depth || 1));

      treeLayout(root);

      // Helper to convert (angle, radius) to fixed Cartesian (x, y)
      const radialPoint = (angle, r) => [
        r * Math.cos(angle - Math.PI / 2),
        r * Math.sin(angle - Math.PI / 2)
      ];

      // Draw curved radial links colored by their cluster
      const links = g.append('g')
        .selectAll('path')
        .data(root.links())
        .join('path')
        .attr('class', 'link')
        .attr('d', d3.linkRadial()
          .angle(d => d.x)
          .radius(d => d.y)
        )
        .attr('stroke', d => colorScale(d.target.data.category))
        .attr('stroke-width', d => d.target.depth === 1 ? 2.5 : 1.8);

      // Draw fixed nodes
      const nodes = g.append('g')
        .selectAll('g')
        .data(root.descendants())
        .join('g')
        .attr('class', 'node')
        .attr('transform', d => {
          const [x, y] = radialPoint(d.x, d.y);
          return `translate(${x},${y})`;
        });

      // Node circles
      nodes.append('circle')
        .attr('r', d => {
          if (d.depth === 0) return 15;
          if (d.depth === 1) return 11;
          return 8;
        })
        .attr('fill', d => {
          if (d.depth === 0) return '#f0f6fc';
          return colorScale(d.data.category);
        })
        .attr('stroke', '#0d1117')
        .attr('stroke-width', 2.5);

      // Node text labels positioned outward cleanly
      nodes.append('text')
        .attr('dy', '0.32em')
        .attr('x', d => {
          if (d.depth === 0) return 0;
          return d.x < Math.PI ? 14 : -14;
        })
        .attr('y', d => d.depth === 0 ? -24 : 0)
        .attr('text-anchor', d => {
          if (d.depth === 0) return 'middle';
          return d.x < Math.PI ? 'start' : 'end';
        })
        .style('font-weight', d => d.depth < 2 ? '600' : '400')
        .text(d => d.data.name);

      // Interactive Hover Glow & Cluster Highlight
      nodes.on('mouseover', function(event, d) {
        const nodeColor = d.depth === 0 ? '#ffffff' : colorScale(d.data.category);

        // Make hovered node glow brightly
        d3.select(this).select('circle')
          .style('filter', `drop-shadow(0 0 12px ${nodeColor}) drop-shadow(0 0 4px #ffffff)`);

        // Highlight connected links in the same cluster or direct lineage
        links.classed('highlighted', l =>
          l.target === d || l.source === d || (d.depth === 1 && l.target.parent === d)
        );

        // Show tooltip with context
        if (d.data.type === 'file') {
          tooltip.html(`
            <div class="tt-title" style="color:${nodeColor}">${d.data.name}</div>
            <div class="tt-meta">Cluster: ${d.data.category}</div>
            <div class="tt-meta">File: ${d.data.rawPath}</div>
          `).style('opacity', 1);
        } else if (d.data.type === 'category') {
          tooltip.html(`
            <div class="tt-title" style="color:${nodeColor}">${d.data.name}</div>
            <div class="tt-meta">${d.children.length} related note(s) in this cluster</div>
          `).style('opacity', 1);
        }
      })
      .on('mousemove', (event) => {
        tooltip
          .style('left', (event.pageX + 15) + 'px')
          .style('top', (event.pageY + 15) + 'px');
      })
      .on('mouseout', function() {
        d3.select(this).select('circle').style('filter', null);
        links.classed('highlighted', false);
        tooltip.style('opacity', 0);
      });

      // Click to open HTML document
      nodes.on('click', (event, d) => {
        if (d.data.type === 'file' && d.data.url) {
          window.location.href = d.data.url;
        }
      });

      // Instant Search Filter with Glow on Matches
      document.getElementById('search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();

        nodes.style('opacity', d => {
          if (!term) return 1;
          if (d.depth === 0) return 0.4;
          const selfMatch = d.data.name.toLowerCase().includes(term) ||
                            (d.data.category && d.data.category.toLowerCase().includes(term));
          const childMatch = d.children && d.children.some(c => c.data.name.toLowerCase().includes(term));
          return (selfMatch || childMatch) ? 1 : 0.15;
        });

        nodes.select('circle').style('filter', d => {
          if (!term || d.depth === 0) return null;
          const isMatch = d.data.name.toLowerCase().includes(term);
          return isMatch ? `drop-shadow(0 0 10px ${colorScale(d.data.category)})` : null;
        });

        links.style('opacity', l => {
          if (!term) return 0.45;
          const match = l.target.data.name.toLowerCase().includes(term) ||
                        (l.target.data.category && l.target.data.category.toLowerCase().includes(term));
          return match ? 0.9 : 0.08;
        });
      });
    }

    async function init() {
      const statusEl = document.getElementById('status');
      const fileList = await fetchHtmlFileList();
      const parsedFiles = fileList.map(parseFileSemantics);
      const hierarchyData = buildHierarchyData(parsedFiles);

      statusEl.textContent = `Mapped ${parsedFiles.length} notes across ${hierarchyData.children.length} clusters`;
      renderFixedMindMap(hierarchyData, parsedFiles.length);

      window.addEventListener('resize', () => {
        renderFixedMindMap(hierarchyData, parsedFiles.length);
      });
    }

    init();
  </script>
</body>
</html>
