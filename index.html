<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tech Stuff — Knowledge Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      overflow: hidden;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }

    /* Responsive UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(22, 27, 34, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid #30363d;
      width: 330px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      transition: all 0.25s ease;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f0f6fc;
    }
    #fit-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.74rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    #fit-btn:hover {
      background: #30363d;
      border-color: #58a6ff;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    #search {
      width: 100%;
      padding: 8px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #f0f6fc;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }
    #status {
      font-size: 0.74rem;
      color: #58a6ff;
      margin-top: 8px;
    }
    #legend {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.73rem;
      color: #8b949e;
      border-top: 1px solid #21262d;
      padding-top: 9px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .shape-diamond {
      width: 9px;
      height: 9px;
      transform: rotate(45deg);
      display: inline-block;
      border-radius: 1px;
    }
    .shape-circle {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Mobile-Specific Compact Adjustments */
    @media (max-width: 640px) {
      #ui-overlay {
        top: 10px;
        left: 10px;
        right: 10px;
        width: auto;
        max-width: none;
        padding: 12px 14px;
      }
      p.subtitle {
        display: none;
      }
      #status {
        display: none;
      }
      #legend {
        margin-top: 8px;
        padding-top: 8px;
        gap: 8px;
        font-size: 0.7rem;
      }
    }

    /* Tooltip / Bottom Info Bar on Mobile */
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(22, 27, 34, 0.96);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      color: #c9d1d9;
      font-size: 0.8rem;
      max-width: 280px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 20;
    }
    .tt-title {
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 3px;
      font-size: 0.86rem;
    }
    .tt-meta {
      color: #8b949e;
      font-size: 0.73rem;
    }

    svg {
      width: 100vw;
      height: 100dvh;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    svg:active {
      cursor: grabbing;
    }
    .link {
      fill: none;
      stroke-opacity: 0.45;
      transition: stroke-opacity 0.2s ease, stroke-width 0.2s ease;
    }
    .link.highlighted {
      stroke-opacity: 1;
      stroke-width: 3px !important;
    }
    .node {
      cursor: pointer;
    }
    .node-shape {
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.2s ease;
    }
    .node:hover .node-shape {
      transform: scale(1.35);
    }
    .node text {
      font-size: 12px;
      fill: #c9d1d9;
      pointer-events: none;
      text-shadow: 0 2px 4px #0d1117, 0 -2px 4px #0d1117, 2px 0 4px #0d1117, -2px 0 4px #0d1117;
      transition: fill 0.2s ease, font-weight 0.2s ease;
    }
    .node:hover text {
      fill: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div class="header-row">
      <h1>Semantic Knowledge Map</h1>
      <button id="fit-btn" title="Fit graph to screen">Reset View</button>
    </div>
    <p class="subtitle">Scroll or pinch to zoom. Diamonds represent directories/hubs; circles represent HTML notes.</p>
    <input type="text" id="search" placeholder="Search notes or directories...">
    <div id="status">Loading repository structure...</div>
    <div id="legend"></div>
  </div>

  <div id="tooltip"></div>
  <svg id="mindmap"></svg>

  <script>
    const DEFAULT_OWNER = 'skredx';
    const DEFAULT_REPO = 'tech-stuff';

    const FALLBACK_FILES = [
      "KNN_(superv).html",
      "LLMs/LLMs from zero, Part 1_ Foundations and the Transformer.html",
      "LLMs/LLMs from zero, Part 2_ Transformer tricks and generation.html",
      "LLMs/LLMs from zero, Part 3_ Training, alignment and reasoning.html",
      "camera_calib_notes.html"
    ];

    const CLUSTER_PALETTE = [
      "#a371f7", // Purple
      "#3fb950", // Green
      "#58a6ff", // Blue
      "#f78166", // Coral
      "#d29922", // Gold
      "#ff7b72"  // Pink-Red
    ];

    const SHORTHAND_MAP = {
      'knn': { title: 'k-Nearest Neighbours (KNN)', category: 'Supervised Learning' },
      'superv': { title: 'Supervised Learning', category: 'Supervised Learning' },
      'camera_calib_notes': { title: 'Camera Calibration Notes', category: 'Computer Vision' },
      'calib': { title: 'Camera Calibration', category: 'Computer Vision' }
    };

    function getRepoDetails() {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (host.endsWith('github.io')) {
        const owner = host.split('.')[0];
        const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
        return { owner, repo };
      }
      return { owner: DEFAULT_OWNER, repo: DEFAULT_REPO };
    }

    async function fetchHtmlFileList() {
      const { owner, repo } = getRepoDetails();
      try {
        const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
        if (!repoRes.ok) throw new Error('API unavailable');
        const repoData = await repoRes.json();
        const branch = repoData.default_branch || 'main';

        const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
        if (!treeRes.ok) throw new Error('Tree unavailable');
        const treeData = await treeRes.json();

        const files = treeData.tree
          .filter(item => item.type === 'blob' && item.path.endsWith('.html') && item.path.toLowerCase() !== 'index.html')
          .map(item => item.path);

        return files.length ? files : FALLBACK_FILES;
      } catch {
        return FALLBACK_FILES;
      }
    }

    function parseFileSemantics(filePath) {
      const parts = filePath.split('/');
      const rawFileName = parts.pop().replace(/\.html$/i, '');
      const folderName = parts.length > 0 ? parts.join(' / ') : null;
      const encodedUrl = filePath.split('/').map(encodeURIComponent).join('/');

      let category = folderName;
      let displayTitle = rawFileName.replace(/_/g, ': ').replace(/\s+/g, ' ').trim();

      const lowerRaw = rawFileName.toLowerCase();
      if (SHORTHAND_MAP[lowerRaw]) {
        displayTitle = SHORTHAND_MAP[lowerRaw].title;
        category = category || SHORTHAND_MAP[lowerRaw].category;
      } else {
        const parenMatch = rawFileName.match(/^([a-zA-Z0-9_-]+?)\s*\(([^)]+)\)$/);
        if (parenMatch) {
          const baseKey = parenMatch[1].replace(/_/g, '').toLowerCase();
          const tagKey = parenMatch[2].toLowerCase();
          displayTitle = SHORTHAND_MAP[baseKey]?.title || parenMatch[1];
          if (!category && SHORTHAND_MAP[tagKey]) {
            category = SHORTHAND_MAP[tagKey].category;
          }
        }
      }

      const seriesRegex = /^(.+?)(?:,\s*|\s+-\s+|\s+)?(?:Part|Ch|Chapter|Module)\s*(\d+)\s*[:\-–_]\s*(.+)$/i;
      const seriesMatch = displayTitle.match(seriesRegex);
      if (seriesMatch) {
        const seriesName = seriesMatch[1].trim();
        const partNum = seriesMatch[2].trim();
        const coreTopic = seriesMatch[3].trim();
        category = category || seriesName;
        displayTitle = `Part ${partNum}: ${coreTopic}`;
      } else if (!category) {
        if (lowerRaw.includes('calib') || lowerRaw.includes('camera')) {
          category = 'Computer Vision';
          displayTitle = 'Camera Calibration';
        } else {
          category = 'General Notes';
        }
      }

      return {
        title: displayTitle,
        category: category,
        rawPath: filePath,
        url: encodedUrl
      };
    }

    function buildHierarchyData(parsedFiles) {
      const root = {
        name: "Tech Stuff",
        type: "root",
        children: []
      };

      const categoryMap = new Map();
      parsedFiles.forEach(file => {
        if (!categoryMap.has(file.category)) {
          const catNode = {
            name: file.category,
            type: "directory",
            category: file.category,
            children: []
          };
          categoryMap.set(file.category, catNode);
          root.children.push(catNode);
        }
        categoryMap.get(file.category).children.push({
          name: file.title,
          type: "file",
          category: file.category,
          rawPath: file.rawPath,
          url: file.url
        });
      });

      return root;
    }

    // Helper to wrap long node labels into compact multi-line SVG <tspan> elements
    function wrapTextLabels(selection, maxCharsPerLine) {
      selection.each(function(d) {
        const text = d3.select(this);
        const words = d.data.name.split(/\s+/);
        text.text(null);

        const xOffset = text.attr('x') || 0;
        let line = [];
        let lines = [];

        words.forEach(word => {
          line.push(word);
          if (line.join(' ').length > maxCharsPerLine && line.length > 1) {
            line.pop();
            lines.push(line.join(' '));
            line = [word];
          }
        });
        if (line.length > 0) lines.push(line.join(' '));

        const startDy = lines.length > 1 ? -((lines.length - 1) * 0.55) + 0.32 : 0.32;
        lines.forEach((l, i) => {
          text.append('tspan')
            .attr('x', xOffset)
            .attr('dy', i === 0 ? `${startDy}em` : '1.15em')
            .text(l);
        });
      });
    }

    function renderFixedMindMap(hierarchyData) {
      const svg = d3.select('#mindmap');
      const tooltip = d3.select('#tooltip');
      const width = window.innerWidth;
      const height = window.innerHeight;
      const isMobile = width <= 640;

      // Adjust branch lengths and text wrapping based on device viewport
      const baseRadius = isMobile
        ? Math.min(width, height) * 0.44
        : Math.min(width, height) * 0.36;
      const maxLabelChars = isMobile ? 20 : 32;

      svg.selectAll('*').remove();

      const g = svg.append('g').attr('class', 'graph-Content');

      // Assign distinct colors to each directory/category cluster
      const categories = (hierarchyData.children || []).map(d => d.name);
      const colorScale = d3.scaleOrdinal()
        .domain(categories)
        .range(CLUSTER_PALETTE);

      // Update Legend with shape indicators (Diamond = Directory, Circle = File)
      const legendEl = document.getElementById('legend');
      const shapeLegend = `
        <div class="legend-item">
          <span class="shape-diamond" style="background:#f0f6fc;"></span>
          <span>Directory</span>
        </div>
        <div class="legend-item">
          <span class="shape-circle" style="background:#8b949e;"></span>
          <span>HTML File</span>
        </div>
      `;
      const clusterLegend = categories.map(cat => `
        <div class="legend-item">
          <span class="shape-circle" style="background:${colorScale(cat)}; box-shadow: 0 0 6px ${colorScale(cat)};"></span>
          <span>${cat}</span>
        </div>
      `).join('');
      legendEl.innerHTML = shapeLegend + clusterLegend;

      // Deterministic Radial Tree with mobile-aware angular spacing
      const root = d3.hierarchy(hierarchyData);
      const treeLayout = d3.tree()
        .size([2 * Math.PI, baseRadius])
        .separation((a, b) => (a.parent === b.parent ? 1.4 : 2.4) / (a.depth || 1));

      treeLayout(root);

      // Adjust depth radii so inner directories and outer files have balanced spacing
      root.each(d => {
        if (d.depth === 0) d.y = 0;
        if (d.depth === 1) d.y = baseRadius * 0.45;
        if (d.depth === 2) d.y = baseRadius;
      });

      const radialPoint = (angle, r) => [
        r * Math.cos(angle - Math.PI / 2),
        r * Math.sin(angle - Math.PI / 2)
      ];

      // Draw curved links
      const links = g.append('g')
        .selectAll('path')
        .data(root.links())
        .join('path')
        .attr('class', 'link')
        .attr('d', d3.linkRadial()
          .angle(d => d.x)
          .radius(d => d.y)
        )
        .attr('stroke', d => colorScale(d.target.data.category))
        .attr('stroke-width', d => d.target.depth === 1 ? 2.5 : 1.8);

      // Draw fixed nodes
      const nodes = g.append('g')
        .selectAll('g')
        .data(root.descendants())
        .join('g')
        .attr('class', 'node')
        .attr('transform', d => {
          const [x, y] = radialPoint(d.x, d.y);
          return `translate(${x},${y})`;
        });

      // Render Diamonds for Directories/Root and Circles for Individual Files
      const diamondGenerator = d3.symbol().type(d3.symbolDiamond);

      nodes.each(function(d) {
        const nodeGroup = d3.select(this);
        const fillColor = d.depth === 0 ? '#f0f6fc' : colorScale(d.data.category);

        if (d.data.type === 'root' || d.data.type === 'directory') {
          // Diamond shape for root and directory nodes
          const symbolSize = d.depth === 0 ? 360 : 230;
          nodeGroup.append('path')
            .attr('class', 'node-shape')
            .attr('d', diamondGenerator.size(symbolSize)())
            .attr('fill', fillColor)
            .attr('stroke', '#0d1117')
            .attr('stroke-width', 2.5);
        } else {
          // Circle shape for individual HTML file nodes
          nodeGroup.append('circle')
            .attr('class', 'node-shape')
            .attr('r', 8.5)
            .attr('fill', fillColor)
            .attr('stroke', '#0d1117')
            .attr('stroke-width', 2.5);
        }
      });

      // Position & wrap text labels cleanly
      const labels = nodes.append('text')
        .attr('x', d => {
          if (d.depth === 0) return 0;
          return d.x < Math.PI ? 15 : -15;
        })
        .attr('y', d => d.depth === 0 ? -22 : 0)
        .attr('text-anchor', d => {
          if (d.depth === 0) return 'middle';
          return d.x < Math.PI ? 'start' : 'end';
        })
        .style('font-size', isMobile ? '11px' : '12.5px')
        .style('font-weight', d => d.depth < 2 ? '600' : '400');

      wrapTextLabels(labels, maxLabelChars);

      // Enable Desktop Scroll Zoom + Mobile Multi-Touch Pinch Zoom & Pan
      const zoom = d3.zoom()
        .scaleExtent([0.2, 4])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });

      svg.call(zoom).on('dblclick.zoom', null);

      // Auto-Fit Function: Calculates exact bounding box of all nodes + labels and fits to screen
      function fitGraphToScreen(animate = false) {
        const bounds = g.node().getBBox();
        if (!bounds.width || !bounds.height) return;

        const overlayRect = document.getElementById('ui-overlay').getBoundingClientRect();
        const padX = isMobile ? 28 : 64;
        const topSpace = isMobile ? overlayRect.bottom + 20 : 50;
        const bottomSpace = 36;

        const availWidth = width - padX * 2;
        const availHeight = height - topSpace - bottomSpace;

        const scale = Math.min(
          1.25,
          availWidth / bounds.width,
          availHeight / bounds.height
        );

        const centerX = bounds.x + bounds.width / 2;
        const centerY = bounds.y + bounds.height / 2;

        const targetX = (width / 2) - centerX * scale;
        const targetY = topSpace + (availHeight / 2) - centerY * scale;

        const transform = d3.zoomIdentity.translate(targetX, targetY).scale(scale);
        if (animate) {
          svg.transition().duration(450).call(zoom.transform, transform);
        } else {
          svg.call(zoom.transform, transform);
        }
      }

      // Fit immediately on load so default view always shows the full mind map
      fitGraphToScreen(false);
      document.getElementById('fit-btn').onclick = () => fitGraphToScreen(true);

      // Interactive Hover Glow
      nodes.on('mouseover', function(event, d) {
        const nodeColor = d.depth === 0 ? '#ffffff' : colorScale(d.data.category);

        d3.select(this).select('.node-shape')
          .style('filter', `drop-shadow(0 0 12px ${nodeColor}) drop-shadow(0 0 4px #ffffff)`);

        links.classed('highlighted', l =>
          l.target === d || l.source === d || (d.depth === 1 && l.target.parent === d)
        );

        if (d.data.type === 'file') {
          tooltip.html(`
            <div class="tt-title" style="color:${nodeColor}">${d.data.name}</div>
            <div class="tt-meta">Directory: ${d.data.category}</div>
            <div class="tt-meta">Click or tap to open document</div>
          `).style('opacity', 1);
        } else if (d.data.type === 'directory') {
          tooltip.html(`
            <div class="tt-title" style="color:${nodeColor}">◆ ${d.data.name}</div>
            <div class="tt-meta">Directory Hub (${d.children.length} files)</div>
          `).style('opacity', 1);
        }
      })
      .on('mousemove', (event) => {
        const x = Math.min(event.pageX + 14, width - 260);
        const y = Math.min(event.pageY + 14, height - 90);
        tooltip.style('left', x + 'px').style('top', y + 'px');
      })
      .on('mouseout', function() {
        d3.select(this).select('.node-shape').style('filter', null);
        links.classed('highlighted', false);
        tooltip.style('opacity', 0);
      });

      // Open HTML file on click / tap
      nodes.on('click', (event, d) => {
        if (d.data.type === 'file' && d.data.url) {
          window.location.href = d.data.url;
        }
      });

      // Search & Filter with Glow
      document.getElementById('search').oninput = (e) => {
        const term = e.target.value.toLowerCase().trim();

        nodes.style('opacity', d => {
          if (!term) return 1;
          if (d.depth === 0) return 0.4;
          const selfMatch = d.data.name.toLowerCase().includes(term) ||
                            (d.data.category && d.data.category.toLowerCase().includes(term));
          const childMatch = d.children && d.children.some(c => c.data.name.toLowerCase().includes(term));
          return (selfMatch || childMatch) ? 1 : 0.15;
        });

        nodes.select('.node-shape').style('filter', d => {
          if (!term || d.depth === 0) return null;
          const isMatch = d.data.name.toLowerCase().includes(term);
          return isMatch ? `drop-shadow(0 0 10px ${colorScale(d.data.category)})` : null;
        });

        links.style('opacity', l => {
          if (!term) return 0.45;
          const match = l.target.data.name.toLowerCase().includes(term) ||
                        (l.target.data.category && l.target.data.category.toLowerCase().includes(term));
          return match ? 0.9 : 0.08;
        });
      };
    }

    async function init() {
      const statusEl = document.getElementById('status');
      const fileList = await fetchHtmlFileList();
      const parsedFiles = fileList.map(parseFileSemantics);
      const hierarchyData = buildHierarchyData(parsedFiles);

      statusEl.textContent = `Mapped ${parsedFiles.length} notes across ${hierarchyData.children.length} directories`;
      renderFixedMindMap(hierarchyData);

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => renderFixedMindMap(hierarchyData), 150);
      });
    }

    init();
  </script>
</body>
</html>
