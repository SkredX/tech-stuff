<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Stuff — Interactive Mind Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid #30363d;
      max-width: 340px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      pointer-events: auto;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    #search {
      width: 100%;
      padding: 8px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #f0f6fc;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #search:focus {
      border-color: #58a6ff;
    }
    #status {
      font-size: 0.78rem;
      color: #58a6ff;
      margin-top: 10px;
    }
    .legend {
      margin-top: 12px;
      display: flex;
      gap: 14px;
      font-size: 0.78rem;
      color: #8b949e;
      border-top: 1px solid #21262d;
      padding-top: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    svg {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    .link {
      stroke: #30363d;
      stroke-opacity: 0.7;
    }
    .node {
      cursor: pointer;
    }
    .node circle {
      transition: r 0.2s ease, filter 0.2s ease;
    }
    .node:hover circle {
      filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.8));
    }
    .node text {
      font-size: 12px;
      fill: #c9d1d9;
      pointer-events: none;
      text-shadow: 0 2px 4px #0d1117, 0 -2px 4px #0d1117, 2px 0 4px #0d1117, -2px 0 4px #0d1117;
      transition: fill 0.2s, font-weight 0.2s;
    }
    .node:hover text {
      fill: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h1>Knowledge Graph</h1>
    <p class="subtitle">Drag nodes to rearrange, scroll to zoom, and click any file node to read the article.</p>
    <input type="text" id="search" placeholder="Filter nodes by name...">
    <div id="status">Syncing repository tree...</div>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#f0883e;"></span> Folder / Hub</div>
      <div class="legend-item"><span class="dot" style="background:#58a6ff;"></span> HTML Document</div>
    </div>
  </div>

  <svg id="mindmap"></svg>

  <script>
    // Configuration: Auto-detects user/repo on GitHub Pages, with fallback to your repo
    const DEFAULT_OWNER = 'skredx';
    const DEFAULT_REPO = 'tech-stuff';

    // Fallback file list in case of offline local testing or API rate limit
    const FALLBACK_FILES = [
      "KNN_(superv).html",
      "LLMs from zero, Part 1_ Foundations and the Transformer.html",
      "LLMs from zero, Part 2_ Transformer tricks and generation.html",
      "LLMs from zero, Part 3_ Training, alignment and reasoning.html",
      "camera_calib_notes.html"
    ];

    function getRepoDetails() {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (host.endsWith('github.io')) {
        const owner = host.split('.')[0];
        const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
        return { owner, repo };
      }
      return { owner: DEFAULT_OWNER, repo: DEFAULT_REPO };
    }

    async function fetchHtmlFiles() {
      const statusEl = document.getElementById('status');
      const { owner, repo } = getRepoDetails();

      try {
        // 1. Fetch repository metadata to identify the default branch
        const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
        if (!repoRes.ok) throw new Error('API Rate limit or private repo');
        const repoData = await repoRes.json();
        const branch = repoData.default_branch || 'main';

        // 2. Fetch the full recursive git tree
        const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
        if (!treeRes.ok) throw new Error('Could not fetch git tree');
        const treeData = await treeRes.json();

        const htmlFiles = treeData.tree
          .filter(item => item.type === 'blob' && item.path.endsWith('.html') && item.path.toLowerCase() !== 'index.html')
          .map(item => item.path);

        statusEl.textContent = `Loaded ${htmlFiles.length} files from ${owner}/${repo}`;
        return htmlFiles.length ? htmlFiles : FALLBACK_FILES;
      } catch (err) {
        statusEl.textContent = `Using cached file list (${FALLBACK_FILES.length} files)`;
        return FALLBACK_FILES;
      }
    }

    function buildGraphData(filePaths) {
      const nodes = [];
      const links = [];
      const folderSet = new Map();

      // Color scale for different folders
      const colorScale = d3.scaleOrdinal(d3.schemeTableau10);

      // Create Central Root Hub
      const rootId = 'ROOT';
      nodes.push({
        id: rootId,
        label: 'tech-stuff (Root)',
        type: 'root',
        group: 'root',
        radius: 16
      });
      folderSet.set('', rootId);

      filePaths.forEach(filePath => {
        const parts = filePath.split('/');
        const fileName = parts.pop();
        let currentParentId = rootId;
        let currentPath = '';

        // Create intermediate folder nodes so files in the same folder cluster together
        parts.forEach(folderName => {
          currentPath = currentPath ? `${currentPath}/${folderName}` : folderName;
          if (!folderSet.has(currentPath)) {
            const folderId = `FOLDER:${currentPath}`;
            nodes.push({
              id: folderId,
              label: folderName,
              type: 'folder',
              group: currentPath,
              radius: 12
            });
            links.push({
              source: currentParentId,
              target: folderId,
              distance: 90
            });
            folderSet.set(currentPath, folderId);
          }
          currentParentId = folderSet.get(currentPath);
        });

        // Clean display title for the HTML file
        const cleanTitle = fileName
          .replace(/\.html$/i, '')
          .replace(/_/g, ': ');

        const fileId = `FILE:${filePath}`;
        nodes.push({
          id: fileId,
          label: cleanTitle,
          type: 'file',
          group: currentPath || 'root',
          url: filePath.split('/').map(encodeURIComponent).join('/'),
          radius: 8,
          color: colorScale(currentPath || 'root')
        });

        links.push({
          source: currentParentId,
          target: fileId,
          distance: 65
        });
      });

      return { nodes, links };
    }

    function renderMindMap(data) {
      const svg = d3.select('#mindmap');
      const width = window.innerWidth;
      const height = window.innerHeight;

      const container = svg.append('g');

      // Enable Zoom and Pan
      const zoom = d3.zoom()
        .scaleExtent([0.2, 4])
        .on('zoom', (event) => {
          container.attr('transform', event.transform);
        });

      svg.call(zoom);

      // Force Simulation for Mind-Map clustering
      const simulation = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.links).id(d => d.id).distance(d => d.distance).strength(0.8))
        .force('charge', d3.forceManyBody().strength(d => d.type === 'file' ? -180 : -350))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collide', d3.forceCollide().radius(d => d.radius + 28).iterations(2));

      // Draw Links
      const link = container.append('g')
        .selectAll('line')
        .data(data.links)
        .join('line')
        .attr('class', 'link')
        .attr('stroke-width', d => d.target.type === 'folder' ? 2.5 : 1.5);

      // Draw Nodes
      const node = container.append('g')
        .selectAll('g')
        .data(data.nodes)
        .join('g')
        .attr('class', 'node')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      // Node Circles
      node.append('circle')
        .attr('r', d => d.radius)
        .attr('fill', d => {
          if (d.type === 'root') return '#f0883e';
          if (d.type === 'folder') return '#d29922';
          return d.color || '#58a6ff';
        })
        .attr('stroke', '#0d1117')
        .attr('stroke-width', 2);

      // Node Labels
      node.append('text')
        .attr('dx', d => d.radius + 6)
        .attr('dy', '0.32em')
        .text(d => d.label);

      // Open HTML file on click
      node.on('click', (event, d) => {
        if (event.defaultPrevented) return; // ignore drag
        if (d.type === 'file' && d.url) {
          window.location.href = d.url;
        }
      });

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      // Search / Filter functionality
      document.getElementById('search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();
        node.style('opacity', d => {
          if (!term || d.type !== 'file') return 1;
          return d.label.toLowerCase().includes(term) ? 1 : 0.15;
        });
        link.style('opacity', d => {
          if (!term) return 0.7;
          return (d.target.label && d.target.label.toLowerCase().includes(term)) ? 0.9 : 0.1;
        });
      });

      // Handle Window Resize
      window.addEventListener('resize', () => {
        simulation.force('center', d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));
        simulation.alpha(0.3).restart();
      });

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }
    }

    // Initialize
    fetchHtmlFiles().then(files => {
      const graphData = buildGraphData(files);
      renderMindMap(graphData);
    });
  </script>
</body>
</html>
